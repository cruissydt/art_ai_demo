        .page_find_book {

            content: " ";
            width: 130px;
            height: 130px;
            position: relative;
            left: 50%;
            transform: translateX(-50%);
            background: url(https://sydtfrank.github.io/koha_ds-1/v_02/uploads/doll_09.svg) 50% 50% no-repeat;
            background-size: cover;
        }

        .page_find_book .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        .page_find_book .header-section h4 {
            color: var(--color_primary);
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .page_find_book .header-section p {
            font-size: 20px;
            font-weight: 500;
        }

        .page_find_book .search-form {
            margin-bottom: 24px;
        }

        .page_find_book .input-container {
            position: relative;
            margin-bottom: 12px;
        }

        .page_find_book .search-textarea {
            width: 100%;
            height: 110px;
            padding: 16px;
            padding-bottom: 30px;
            font-size: 16px;
            color: #2d3748;
            background-color: #f7fafc;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            resize: none;
            outline: none;
            transition: all 0.25s ease-in-out;
            line-height: 1.5;
        }

        .page_find_book .search-textarea:focus {
            background-color: #ffffff;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);
        }

        .page_find_book .search-textarea::placeholder {
            text-align: left;
            font-style: normal;
            font-size: 14px;
            font-weight: 400;
        }


        .page_find_book .char-counter {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 12px;
            color: #a0aec0;
            pointer-events: none;
            user-select: none;
        }

        .page_find_book .char-counter.limit-reached {
            color: #e53e3e;
            font-weight: bold;
        }


        .page_find_book .example-container {
            margin-bottom: 24px;
        }

        .page_find_book .example-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .page_find_book .example-title {
            font-size: 13px;
            font-weight: 600;
            color: #718096;
            display: block;
        }

        .page_find_book .btn-refresh-examples {
            font-size: 13px;
            color: #3182ce;
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 4px;
            transition: all 0.2s;
            font-weight: 600;
        }

        .page_find_book .btn-refresh-examples:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
        }

        .page_find_book .example-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 38px;
        }

        .page_find_book .example-tag {
            background-color: #edf2f7;
            color: #4a5568;
            border: 1px solid #e2e8f0;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .page_find_book .example-tag:hover {
            background-color: #ebf8ff;
            color: #2b6cb0;
            border-color: #bee3f8;
        }


        .page_find_book .btn-submit {
            display: block;
            width: 100%;
            background-color: #3182ce;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .page_find_book .btn-submit:hover {
            background-color: #2b6cb0;
        }

        .page_find_book .btn-submit:active {
            transform: scale(0.995);
        }

        .page_find_book .btn-submit:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
            transform: none;
        }


        .page_find_book .loader-wrapper {
            display: none;
            text-align: center;
            padding: 40px 0;
        }

        .page_find_book .loader {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #edf2f7;
            border-left-color: #3182ce;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .page_find_book .loader-text {
            margin-top: 12px;
            color: #718096;
            font-size: 14px;
        }


        .page_find_book .error-message {
            display: none;
            background-color: #fff5f5;
            border: 1px solid #fed7d7;
            color: #c53030;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.5;

        .page_find_book .results-container {
            margin-top: 32px;
            display: none;
        }

        .page_find_book .results-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;

            color: #718096;
            margin: 0 0 4px 0;

            color: #a0aec0;

        }

            background-color: #f7fafc;

            font-size: 14px;
            color: #4a5568;
            line-height: 1.6;
            margin-bottom: 16px;
            border-radius: 0 6px 6px 0;

            padding-top: 12px;

            background-color: #ebf8ff;
            color: #2b6cb0;

            color: #2b6cb0;

        }

        }

    </style>
</head>

                { tag: "親子情緒教育遊戲", text: "想用遊戲方式教孩子認識情緒，卻沒方法" },
                { tag: "職場工作情境彈性應變", text: "計畫總趕不上變化，想學臨場應變能力" },
                { tag: "旅遊行程季節性活動", text: "想配合當地節慶出遊，卻不知道時間點" },
                { tag: "手作串珠桌飾", text: "想做串珠小擺飾裝點餐桌，卻沒有靈感" },
                { tag: "職場工作情境反省檢討", text: "犯錯後不知道怎麼從失敗中學習成長" },
                { tag: "咖啡沖煮個人配方", text: "想調出自己專屬的沖煮配方，卻不知怎麼試" },
                { tag: "居家收納陽台曬衣", text: "曬衣空間不足，想學小陽台曬衣收納法" },
                { tag: "投資獲利長期規劃", text: "想為退休做長期投資規劃，卻不知道怎麼開始" },
                { tag: "親子情緒陪伴日記", text: "想記錄跟孩子相處的點滴，卻不知道怎麼寫" },
                { tag: "職場工作情境自我覺察", text: "常常情緒失控後才後悔，想學自我覺察" },
                { tag: "旅遊行程社群分享", text: "想在社群分享旅遊照片，卻不知道怎麼拍才好看" },
                { tag: "手作串珠杯墊", text: "想織一組漂亮杯墊，卻不知道材質怎麼選" },
                { tag: "職場工作情境正念練習", text: "上班壓力大想學正念紓壓，卻不知道方法" }
            ]


            // ========================================================
            // 隨機抽選並渲染範例標籤
            // ========================================================
            function renderRandomExamples() {
                // 將陣列隨機洗牌
                const shuffled = [...ALL_EXAMPLES].sort(() => 0.5 - Math.random());
                // 取前 6 筆
                const selected = shuffled.slice(0, 6);

                $exampleTagsGrid.empty();
                $.each(selected, function (index, item) {
                    const $tag = $('<div></div>')
                        .addClass('example-tag')
                        .attr('data-text', item.text)
                        .text(item.tag);
                    $exampleTagsGrid.append($tag);
                });
            }

            // 頁面初始化載入第一組範例
            renderRandomExamples();

            // 點擊「換一組」按鈕切換
            $btnRefreshExamples.on('click', function () {
                renderRandomExamples();
            });

            // 1. 即時偵測輸入字數限制與顯示
            $searchInput.on('input', function () {
                const len = $(this).val().length;
                $charCounter.text(len + '/50');

                if (len >= 50) {
                    $charCounter.addClass('limit-reached');
                } else {
                    $charCounter.removeClass('limit-reached');
                }
            });

            // 2. 點擊範例標籤自動帶入輸入框 (使用事件代理，確保隨機換組後依然有效)
            $exampleTagsGrid.on('click', '.example-tag', function () {
                const text = $(this).attr('data-text');
                const truncatedText = text.substring(0, 50);
                $searchInput.val(truncatedText).trigger('input').focus();
            });

            // 3. 處理搜尋送出事件
            $btnSubmit.on('click', function () {
                const queryText = $.trim($searchInput.val());

                if (!queryText) {
                    showError("請輸入您的情境描述後再進行搜尋。");
                    return;
                }

                $errorMessage.hide().text('');
                $resultsContainer.hide();
                $resultsGrid.empty();
                setLoadingState(true);

                $.ajax({
                    url: API_ENDPOINT,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: queryText }),
                    timeout: 25000,
                    success: function (response) {
                        setLoadingState(false);
                        if (response && response.results && response.results.length > 0) {
                            renderResults(response.results);
                        } else {
                            showError("查無符合相關的圖書，建議更換情境描述後再試。");
                        }
                    },
                    error: function (xhr, status, error) {
                        setLoadingState(false);
                        let displayError = "搜尋時發生錯誤，請稍後再試。";

                        if (xhr.status === 429) {
                            displayError = "您的請求太頻繁，已達上限，請稍候再試。";
                        } else if (xhr.status === 413) {
                            displayError = "搜尋字串過長，請縮短後再試。";
                        } else if (xhr.responseJSON && xhr.responseJSON.message) {
                            displayError = "錯誤: " + xhr.responseJSON.message;
                        } else if (xhr.status !== 0) {
                            displayError = "錯誤: HTTP " + xhr.status + " " + error;
                        }

                        showError(displayError);
                    }
                });
            });

            function setLoadingState(isLoading) {
                if (isLoading) {
                    $btnSubmit.prop('disabled', true).text('找書中...');
                    $loaderWrapper.show();
                } else {
                    $btnSubmit.prop('disabled', false).text('AI 開始找書');
                    $loaderWrapper.hide();
                }
            }

            function showError(message) {
                $errorMessage.text(message).fadeIn(200);
            }

            function renderResults(books) {
                $resultsGrid.empty();

                $.each(books, function (index, book) {
                    let scorePercent = "未知";
                    if (book.score !== undefined && !isNaN(book.score)) {
                        scorePercent = (parseFloat(book.score) * 100).toFixed(1) + "%";
                    }

                    const safeTitle = escapeHtml(book.title || "未知書名");
                    const safeAuthors = escapeHtml(book.authors || "未提供作者");
                    const safeIsbn = escapeHtml(book.isbn || "無 ISBN");
                    const safeLlmMsg = escapeHtml(book.llm_msg || "這本書可能對您的情境有所幫助。");
                    const bookUrl = "https://crm.koha.com.tw/cgi-bin/koha/opac-detail.pl?biblionumber=" + encodeURIComponent(book.id);

                    const cardHtml = `
                        <div class="book-card">
                            <div class="book-meta">
                                <h4 class="book-title" title="${safeTitle}">${safeTitle}</h4>
                                <p class="book-authors">👤作者：${safeAuthors}</p>
                                <p class="book-isbn">🔑ISBN：${safeIsbn}</p>
                            </div>
                            <div class="book-reason">
                                <strong>AI 推薦原因：</strong><br>
                                ${safeLlmMsg}
                            </div>
                            <div class="book-footer">
                                <span class="book-score">相關度: ${scorePercent}</span>
                                <a href="${bookUrl}" class="book-link" rel="noopener noreferrer">檢視詳細館藏 ➔</a>
                            </div>
                        </div>
                    `;
                    $resultsGrid.append(cardHtml);
                });

                $resultsContainer.fadeIn(300);
            }

            function escapeHtml(string) {
                return String(string).replace(/[&<>"']/g, function (s) {
                    const entityMap = {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    };
                    return entityMap[s];
                });
            }
        });
        /* AI找書 結束 */
    </script>
</body>
